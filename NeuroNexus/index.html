<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Information Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-container">
        <div class="form-header">
            <h1 class="form-title">Contact Information Form</h1>
            <p class="form-description">Please fill out this form with your contact details</p>
        </div>

        <form action="#" method="POST">
            <div class="form-group">
                <label for="fullName" class="required">Full Name</label>
                <input type="text" id="fullName" name="fullName" required>
            </div>

            <div class="form-group">
                <label for="contactNumber" class="required">Contact Number</label>
                <input type="tel" id="contactNumber" name="contactNumber" required>
            </div>

            <div class="form-group">
                <label for="address" class="required">Address</label>
                <textarea id="address" name="address" required></textarea>
            </div>

            <div class="form-group">
                <label for="companyName" class="required">Company Name</label>
                <input type="text" id="companyName" name="companyName" required>
            </div>

            <div class="form-group">
                <label for="email" class="required">Email Address</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="department" class="required">Department</label>
                <select id="department" name="department" required>
                    <option value="" disabled selected>Choose a department</option>
                    <option value="hr">HR</option>
                    <option value="sales">Sales</option>
                    <option value="development">Development</option>
                    <option value="marketing">Marketing</option>
                    <option value="others">Others</option>
                </select>
            </div>

            <div class="form-group">
                <label class="required">Gender</label>
                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio" id="male" name="gender" value="male" required>
                        <label for="male" style="display: inline;">Male</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="female" name="gender" value="female">
                        <label for="female" style="display: inline;">Female</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="preferNotToSay" name="gender" value="preferNotToSay">
                        <label for="preferNotToSay" style="display: inline;">Prefer not to say</label>
                    </div>
                </div>
            </div>

            <div class="button-container">
                <button type="submit">Submit</button>
            </div>

            <p class="required-text">* Required</p>
        </form>
    </div>
</body>
</html>
